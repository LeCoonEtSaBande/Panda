<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda · draft</title>
<style>
  :root {
    --fond: #0f1416;
    --carte: #172024;
    --carte-2: #1d282d;
    --ligne: #2a383e;
    --texte: #e8eee9;
    --doux: #93a39c;
    --accent: #d8b25a;
    --Pick: #b68cf0;
    --Engage: #f08a5d;
    --Counter-engage: #6fa8f5;
    --Disengage: #6fd39a;
    --Poke: #e8d46a;
    --rayon: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -200px, #1b2a2a 0%, var(--fond) 60%);
    color: var(--texte);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--ligne);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header .date { color: var(--doux); font-size: 13px; margin-left: 12px; }
  button {
    font: inherit; color: var(--texte); background: var(--carte-2);
    border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main {
    display: grid; gap: 18px; padding: 22px 28px 40px;
    grid-template-columns: minmax(260px, 1fr) minmax(340px, 1.35fr) minmax(260px, 1fr);
    max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }
  .carte {
    background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon);
    padding: 16px 18px;
  }
  .carte h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--doux);
  }
  .colonne { display: flex; flex-direction: column; gap: 18px; }
  .slot { position: relative; margin-bottom: 10px; }
  .slot:last-child { margin-bottom: 0; }
  .slot input {
    width: 100%; font: inherit; color: var(--texte); background: var(--carte-2);
    border: 1px solid var(--ligne); border-radius: 9px; padding: 10px 12px; outline: none;
  }
  .slot input:focus { border-color: var(--accent); }
  .slot .choisi {
    display: flex; align-items: center; gap: 10px; background: var(--carte-2);
    border: 1px solid var(--ligne); border-radius: 9px; padding: 8px 10px 8px 12px; min-height: 44px;
  }
  .slot .nom { font-weight: 600; flex: 1; }
  .slot .retirer {
    border: 0; background: transparent; color: var(--doux); padding: 2px 6px; font-size: 18px; line-height: 1;
  }
  .slot .retirer:hover { color: var(--texte); }
  .etiquettes { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ligne);
    color: var(--doux); white-space: nowrap;
  }
  .tag.style { color: var(--fond); border: 0; font-weight: 600; }
  .tag.style.secondaire { background: transparent !important; border: 1px solid; font-weight: 500; }
  .suggestions {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
    background: #202d33; border: 1px solid var(--ligne); border-radius: 9px; overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  .suggestions div { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .suggestions div small { color: var(--doux); }
  .suggestions div.actif, .suggestions div:hover { background: #2a3a41; }
  .titre-compo { font-size: 22px; font-weight: 700; margin: 2px 0 4px; }
  .titre-compo .sec { font-size: 15px; font-weight: 500; color: var(--doux); }
  .vide { color: var(--doux); }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 14px; }
  .puce {
    font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--carte-2);
    border: 1px solid var(--ligne);
  }
  .puce.fort { border-color: var(--accent); color: var(--accent); }
  .barres { display: grid; grid-template-columns: 120px 1fr 26px; gap: 6px 10px; align-items: center; font-size: 13px; }
  .barre { height: 8px; background: var(--carte-2); border-radius: 999px; position: relative; overflow: hidden; }
  .barre i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .barre b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--doux); opacity: .5; }
  .barres .val { text-align: right; color: var(--doux); }
  .compo-allie { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--ligne); }
  .compo-allie .titre-compo { font-size: 17px; }
  .reco { display: flex; flex-direction: column; gap: 10px; }
  .reco .ligne {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px;
    border: 1px solid var(--accent); border-radius: 10px; background: rgba(216,178,90,.06);
  }
  .reco .ligne strong { font-size: 17px; }
  .reco .ligne .chiffres { color: var(--accent); font-weight: 600; text-align: right; }
  .reco .ligne .note { grid-column: 1 / -1; color: var(--doux); font-size: 13px; }
  .pool { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .pool .membre {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-radius: 9px; background: var(--carte-2); border: 1px solid var(--ligne);
  }
  .pool .membre.propose { border-color: var(--accent); }
  .pool .membre.pris { opacity: .4; }
  .aide { color: var(--doux); font-size: 13px; margin: 10px 0 0; }
  footer { color: var(--doux); font-size: 12px; text-align: center; padding: 0 0 24px; }
</style>
</head>

<header>
  <div><h1>Panda <span>· draft</span></h1></div>
  <button id="reinitialiser" type="button">Nouvelle draft</button>
</header>

<main>
  <section class="carte">

        <div id="lecture-allie"></div>
      </div>
    </section>
    <section class="carte">
      <h2>Jungle à prendre</h2>
      <div id="reco" class="reco"></div>
      <div id="pool" class="pool"></div>
    </section>
  </div>

  <section class="carte">
    <h2>Avec moi</h2>
    <div id="allie"></div>
    <p class="aide">Le cinquième, c'est toi au jungle.</p>
  </section>
</main>
<footer id="pied"></footer>

<script>
// Même règle que analyse/regle.py sur la branche d'analyse : les deux doivent rester identiques.
const Regle = (() => {
  const STYLES = ["Engage", "Pick", "Poke", "Counter-engage", "Disengage"];
  const POINTS_PRINCIPAL = 2;
  const POINTS_SECONDAIRE = 1;
  const SEUIL_PRINCIPAL = 3;
  const SEUIL_SECONDAIRE = 2;
  const SEUIL_DEGATS = 4;

  function choisir(scores, principaux, seuil, exclu) {
    let meilleur = "";
    for (const style of STYLES) {
      if (style === exclu || scores[style] < seuil) continue;
      if (
        !meilleur ||
        scores[style] > scores[meilleur] ||
        (scores[style] === scores[meilleur] && principaux[style] > principaux[meilleur])
      ) {
        meilleur = style;
      }
    }
    return meilleur;
  }

  function etiqueter(champions, catalogue) {
    const fiches = champions.filter((nom) => catalogue[nom]).map((nom) => catalogue[nom]);
    const scores = Object.fromEntries(STYLES.map((s) => [s, 0]));
    const principaux = Object.fromEntries(STYLES.map((s) => [s, 0]));
    for (const fiche of fiches) {
      if (fiche.principal) {
        scores[fiche.principal] += POINTS_PRINCIPAL;
        principaux[fiche.principal] += 1;
      }
      if (fiche.secondaire) scores[fiche.secondaire] += POINTS_SECONDAIRE;
    }

    const principal = choisir(scores, principaux, SEUIL_PRINCIPAL, null);
    const secondaire = principal ? choisir(scores, principaux, SEUIL_SECONDAIRE, principal) : "";

    const tanky = new Set(fiches.map((f) => f.tanky));
    const front = tanky.has("HP+") ? "HP+" : tanky.has("HP") ? "HP" : "";
    const disengage = fiches.some((f) => f.principal === "Disengage" || f.secondaire === "Disengage");
    const ad = fiches.filter((f) => f.degats === "AD" || f.degats === "Hybride").length;
    const ap = fiches.filter((f) => f.degats === "AP" || f.degats === "Hybride").length;
    let degats = "mixte";
    if (ad >= SEUIL_DEGATS && ap < SEUIL_DEGATS) degats = "AD";
    else if (ap >= SEUIL_DEGATS && ad < SEUIL_DEGATS) degats = "AP";

    return {
      principal,
      secondaire,
      assassin: fiches.some((f) => f.principal === "Pick"),
      front,
      protect: fiches.some((f) => f.carry) && disengage,
      side: fiches.some((f) => f.split),
      degats,
      scores,
    };
  }

  function correspond(etiquettes, condition) {
    return Object.entries(condition || {}).every(([cle, attendu]) =>
      Array.isArray(attendu) ? attendu.includes(etiquettes[cle]) : etiquettes[cle] === attendu,
    );
  }

  return { STYLES, etiqueter, correspond };
})();

if (typeof module !== "undefined") module.exports = Regle;

</script>

const SCENARIOS = [];

const TAILLE = { adverse: 5, allie: 4 };
const MEMOIRE = "panda-draft";

const fiches = Object.fromEntries(CATALOGUE.map((f) => [f.nom, f]));
const normaliser = (texte) => texte.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const index = CATALOGUE.map((f) => ({ nom: f.nom, cle: normaliser(f.nom) }));

let etat = chargerEtat();

function chargerEtat() {
  try {
    const sauve = JSON.parse(localStorage.getItem(MEMOIRE));
    if (sauve && Array.isArray(sauve.adverse) && Array.isArray(sauve.allie)) return sauve;
  } catch (e) {}
  return { adverse: Array(TAILLE.adverse).fill(""), allie: Array(TAILLE.allie).fill("") };
}

function sauver() {
  try { localStorage.setItem(MEMOIRE, JSON.stringify(etat)); } catch (e) {}
}

function pris() {
  return new Set([...etat.adverse, ...etat.allie].filter(Boolean));
}

function tagStyle(style, secondaire) {
  if (!style) return "";
  const couleur = `var(--${style})`;
  const classe = secondaire ? "tag style secondaire" : "tag style";
  const css = secondaire ? `color:${couleur};border-color:${couleur}` : `background:${couleur}`;
  return `<span class="${classe}" style="${css}">${style}</span>`;
}

function tagsFiche(fiche) {
  const tags = [tagStyle(fiche.principal, false), tagStyle(fiche.secondaire, true)];
  if (fiche.tanky) tags.push(`<span class="tag">${fiche.tanky}</span>`);
  if (fiche.carry) tags.push(`<span class="tag">Carry</span>`);
  if (fiche.split) tags.push(`<span class="tag">Split</span>`);
  tags.push(`<span class="tag">${fiche.degats}</span>`);
  return tags.join("");
}

function suggestionsPour(texte) {
  const cle = normaliser(texte);
  if (!cle) return [];
  const exclus = pris();
  const debut = [], dedans = [];
  for (const entree of index) {
    if (exclus.has(entree.nom)) continue;
    if (entree.cle.startsWith(cle)) debut.push(entree.nom);
    else if (entree.cle.includes(cle)) dedans.push(entree.nom);
  }
  return [...debut, ...dedans].slice(0, 8);
}

function dessinerEquipe(cote) {
  const conteneur = document.getElementById(cote);
  conteneur.innerHTML = "";
  etat[cote].forEach((nom, position) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    if (nom) {
      slot.innerHTML = `<div class="choisi"><div style="flex:1"><div class="nom">${nom}</div><div class="etiquettes">${tagsFiche(fiches[nom])}</div></div><button class="retirer" type="button" title="Retirer">×</button></div>`;
      slot.querySelector(".retirer").addEventListener("click", () => choisir(cote, position, ""));
    } else {
      slot.innerHTML = `<input type="text" autocomplete="off" spellcheck="false" placeholder="Champion ${position + 1}">`;
      brancherSaisie(slot, cote, position);
    }
    conteneur.appendChild(slot);
  });
}

function brancherSaisie(slot, cote, position) {
  const champ = slot.querySelector("input");
  let liste = null;
  let actif = 0;
  let resultats = [];

  const fermer = () => { if (liste) { liste.remove(); liste = null; } };
  const ouvrir = () => {
    fermer();
    resultats = suggestionsPour(champ.value);
    actif = 0;
    if (!resultats.length) return;
    liste = document.createElement("div");
    liste.className = "suggestions";
    resultats.forEach((nom, i) => {
      const ligne = document.createElement("div");
      ligne.className = i === actif ? "actif" : "";
      const f = fiches[nom];
      ligne.innerHTML = `<span>${nom}</span><small>${[f.principal, f.secondaire].filter(Boolean).join(" · ") || "aucun style"}</small>`;
      ligne.addEventListener("mousedown", (e) => { e.preventDefault(); choisir(cote, position, nom); });
      liste.appendChild(ligne);
    });
    slot.appendChild(liste);
  };
  const surligner = () => {
    if (!liste) return;
    [...liste.children].forEach((el, i) => el.classList.toggle("actif", i === actif));
  };

  champ.addEventListener("input", ouvrir);
  champ.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && resultats.length) { actif = (actif + 1) % resultats.length; surligner(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && resultats.length) { actif = (actif - 1 + resultats.length) % resultats.length; surligner(); e.preventDefault(); }
    else if ((e.key === "Enter" || e.key === "Tab") && resultats.length && champ.value) {
      if (e.key === "Enter") e.preventDefault();
      choisir(cote, position, resultats[actif], e.key === "Enter");
    }
    else if (e.key === "Escape") { champ.value = ""; fermer(); }
  });
  champ.addEventListener("blur", () => setTimeout(fermer, 100));
}

function choisir(cote, position, nom, focusSuivant = true) {
  etat[cote][position] = nom;
  sauver();
  dessiner();
  if (nom && focusSuivant) {
    const suivant = document.querySelector(`#${cote} .slot input`);
    if (suivant) suivant.focus();
  }
}

  const puces = [];
  if (etiquettes.assassin) puces.push(`<span class="puce fort">Présence d'un assassin</span>`);
  puces.push(`<span class="puce">${etiquettes.front === "HP+" ? "Front (HP+)" : etiquettes.front === "HP" ? "Front léger (HP)" : "Pas de front"}</span>`);

  if (etiquettes.side) puces.push(`<span class="puce">Side</span>`);
  puces.push(`<span class="puce">${etiquettes.degats === "mixte" ? "Dégâts mixtes" : "Dégâts " + etiquettes.degats}</span>`);

  let barres = "";
  if (grand) {
    const max = 10;
    barres = `<div class="barres">` + Regle.STYLES.map((style) => {
      const v = etiquettes.scores[style];
      return `<span>${style}</span><span class="barre"><i style="width:${Math.min(100, (v / max) * 100)}%;background:var(--${style})"></i><b style="left:${(3 / max) * 100}%"></b></span><span class="val">${v}</span>`;
    }).join("") + `</div>`;
  }
  return `<div class="titre-compo">${titre}</div><div class="puces">${puces.join("")}</div>${barres}`;
}

function dessinerReco(adverse, allie, champions) {
  const zone = document.getElementById("reco");
  const exclus = pris();
  let proposes = new Set();
  if (!SCENARIOS.length) {
    zone.innerHTML = `<p class="vide">Aucun scénario validé pour l'instant. Les recommandations arriveront de l'analyse.</p>`;
  } else if (!champions.length) {
    zone.innerHTML = `<p class="vide">Saisis les champions d'en face.</p>`;
  } else {
    const trouves = SCENARIOS.filter((s) => Regle.correspond(adverse, s.adverse) && Regle.correspond(allie, s.allie));
    if (!trouves.length) {
      zone.innerHTML = `<p class="vide">Aucun scénario validé ne correspond à cette compo.</p>`;
    } else {
      zone.innerHTML = trouves.map((s) => {
        proposes.add(s.jungle);
        const dispo = exclus.has(s.jungle) ? " (déjà pris)" : "";
        return `<div class="ligne"><strong>${s.jungle}${dispo}</strong><span class="chiffres">${s.taux} % · ${s.parties} parties</span><span class="note">${s.id}${s.note ? " — " + s.note : ""}</span></div>`;
      }).join("");
    }
  }
  document.getElementById("pool").innerHTML = POOL.map((nom) => {
    const classes = ["membre", proposes.has(nom) ? "propose" : "", exclus.has(nom) ? "pris" : ""].join(" ");
    return `<div class="${classes}"><span>${nom}</span><span class="etiquettes">${tagsFiche(fiches[nom])}</span></div>`;
  }).join("");
}

function dessiner() {
  dessinerEquipe("adverse");
  dessinerEquipe("allie");
  const adverses = etat.adverse.filter(Boolean);
  const allies = etat.allie.filter(Boolean);
  const etAdverse = Regle.etiqueter(adverses, fiches);
  const etAllie = Regle.etiqueter(allies, fiches);
  document.getElementById("lecture-adverse").innerHTML = lecture(etAdverse, adverses, true);
  document.getElementById("lecture-allie").innerHTML = lecture(etAllie, allies, false);
  dessinerReco(etAdverse, etAllie, adverses);
}

document.getElementById("reinitialiser").addEventListener("click", () => {
  etat = { adverse: Array(TAILLE.adverse).fill(""), allie: Array(TAILLE.allie).fill("") };
  sauver();
  dessiner();
  const premier = document.querySelector("#adverse .slot input");
  if (premier) premier.focus();
});

document.getElementById("pied").textContent =
  `${CATALOGUE.length} champions · ${SCENARIOS.length} scénario${SCENARIOS.length > 1 ? "s" : ""} validé${SCENARIOS.length > 1 ? "s" : ""} · page générée le ${GENERE_LE}`;

dessiner();
const premier = document.querySelector("#adverse .slot input");
if (premier) premier.focus();
</script>
