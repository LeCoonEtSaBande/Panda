# Modifier ce fichier sur main lance une collecte.
# Pour relancer sans rien changer d'autre, augmenter « lancement ».
# Ne jamais écrire la clé Riot ici : le dépôt est public. Elle va dans le secret RIOT_API_KEY
# (Settings > Secrets and variables > Actions).

[collecte]
lancement = 5
minutes = 315
sauvegarde_minutes = 10
jours = 14
# « nouvelles » : chercher de nouvelles parties (par défaut).
# « rattrapage » : compléter les détails des parties déjà dans parties.csv, sans y écrire.
mode = nouvelles
# Les paliers sont pris dans l'ordre : on reste sur le premier tant qu'il donne assez de parties neuves.
# Quand un tour complet de ses divisions en rapporte moins de « tour_min », on passe au suivant (0 = jamais).
paliers = DIAMOND, EMERALD
tour_min = 50
divisions = I, II, III, IV
joueurs_par_page = 5
parties_par_joueur = 20
pages_max = 40

[rapport]
patch = tous
parties_min = 30
