# Modifier ce fichier sur la branche lance une collecte.
# Pour relancer sans rien changer d'autre, augmenter « lancement ».
# Une clé de développement expire au bout de 24 heures : coller la nouvelle dans « cle_api ».

[collecte]
lancement = 5
cle_api = RGAPI-3951398a-c9ba-4701-8a0b-9e09dd05fae6
minutes = 50
sauvegarde_minutes = 10
jours = 14
# Les paliers sont pris dans l'ordre : on reste sur le premier tant qu'il donne assez de parties neuves.
# Quand un tour complet de ses divisions en rapporte moins de « tour_min », on passe au suivant (0 = jamais).
paliers = DIAMOND, EMERALD
tour_min = 50
divisions = I, II, III, IV
joueurs_par_page = 5
parties_par_joueur = 20
pages_max = 40

[rapport]
patch = tous
parties_min = 30
