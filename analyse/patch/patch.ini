# Réglages de « Identifier les champions forts du patch » (workflow champions-patch.yml).
# Ne contient jamais la clé Riot : elle vient du secret RIOT_API_KEY.

[collecte]
# Durée de collecte, en minutes. Le job entier est limité à 6 heures (360 min) : on garde de la marge
# pour l'analyse et l'enregistrement.
minutes = 315
sauvegarde_minutes = 10
# Parties des 7 derniers jours ; seules celles du patch visé sont gardées.
jours = 7
# Patch visé : « actuel » = la dernière version de Data Dragon (par exemple 16.21), sinon un patch précis.
patch = actuel
# Paliers mélangés au hasard (pas l'un après l'autre) : Platine, Émeraude et Diamant.
paliers = DIAMOND, EMERALD, PLATINUM
divisions = I, II, III, IV
joueurs_par_page = 5
parties_par_joueur = 20
pages_max = 40

[analyse]
# Un champion n'est jugé qu'à partir de ce nombre de parties à son poste.
parties_min = 100
