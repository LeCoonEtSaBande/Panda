name: Identifier les champions forts du patch

# Bouton « Run workflow ». Collecte légère (détail des parties seulement, sans timeline) des parties
# du patch en cours en Platine, Émeraude et Diamant, puis classement des champions forts et faibles
# à chaque poste. Le code et les données de cette partie vivent sur la branche « champions-patch »
# (analyse/donnees_patch et analyse/resultats_patch) ; analyse/donnees n'est jamais touché.
# Même file que « Lancer une collecte » : les deux partagent la clé Riot et ne tournent jamais ensemble.
on:
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche du code et des données du patch"
        default: "champions-patch"
        required: true

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
          fetch-depth: 0

      - name: Installer numpy
        run: python3 -m pip install -q --break-system-packages numpy || python3 -m pip install -q numpy

      - name: Collecter les parties du patch
        timeout-minutes: 325
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          COMMANDE_SAUVEGARDE: bash analyse/patch/enregistrer_patch.sh
        run: python3 analyse/patch/collecte_patch.py

      - name: Classer les champions du patch
        if: always()
        timeout-minutes: 15
        run: python3 analyse/patch/champions_forts.py || echo "::warning::Analyse en échec, parties enregistrées quand même."

      - name: Enregistrer
        if: always()
        run: bash analyse/patch/enregistrer_patch.sh
