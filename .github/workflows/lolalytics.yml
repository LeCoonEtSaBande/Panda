name: "2 · Lolalytics : stats du patch (force des champions, contres, synergies)"
# À QUOI IL SERT : récupérer sur Lolalytics la force de chaque champion à chaque poste, les contres et les matchups du
# patch en cours, et la synergie avec chaque allié (branche « scraping »), puis les valeurs et timers du patch pour la
# surcouche en jeu du lien client (lolalytics/valeurs_jeu.json). QUAND : à chaque nouveau patch (environ 40 min), avant le bouton 5.

# Bouton « Run workflow », une fois par patch (environ 20 minutes). Tier list de chaque poste, puis la page
# de chaque champion à chaque poste (matchups, dégâts par type, victoires selon la durée), Platine et plus,
# une page toutes les 3 secondes. Code et résultats sur la branche « scraping » (lolalytics/<patch>/).
# Ensuite : « Générer l'assistant Draft ».
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lolalytics
  cancel-in-progress: false

jobs:
  lolalytics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: À quoi sert ce bouton
        run: |
          echo "### 2 · Lolalytics : force des champions, contres et matchups du patch" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: scraping
          fetch-depth: 0

      - name: Récupérer le patch
        run: python3 lolalytics/recuperer.py

      # Valeurs et timers du patch pour la surcouche en jeu (flashs, Zhonya, dragons, Héraut, prix des objets).
      # Refait à chaque passage, même si le scraper a échoué ; un échec ici n'empêche pas d'enregistrer le scraping.
      - name: Valeurs et timers du patch (surcouche en jeu)
        if: always()
        continue-on-error: true
        run: python3 lolalytics/valeurs_jeu.py

      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lolalytics
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -q -m "Lolalytics : patch récupéré"
          for essai in 1 2 3; do
            if git pull -q --rebase origin scraping && git push -q origin HEAD:scraping; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
