name: Récupérer les stats Lolalytics du patch

# Bouton « Run workflow ». Mode « echantillon » : télécharge une dizaine de pages telles quelles, pour
# écrire le lecteur. Mode « complet » (à venir) : tier list et contres de chaque poste, une page toutes
# les quelques secondes, une fois par patch. Code et résultats sur la branche « scraping ».
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "echantillon ou complet"
        type: choice
        options: [echantillon, complet]
        default: echantillon
      branche:
        description: "Branche du code"
        default: "scraping"
        required: true

permissions:
  contents: write

concurrency:
  group: lolalytics
  cancel-in-progress: false

jobs:
  lolalytics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
          fetch-depth: 0

      - name: Échantillon de pages
        if: inputs.mode == 'echantillon'
        run: python3 analyse/lolalytics/echantillon.py

      - name: Récupération complète
        if: inputs.mode == 'complet'
        run: python3 analyse/lolalytics/recuperer.py

      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyse/lolalytics
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -q -m "Lolalytics : ${{ inputs.mode }}"
          for essai in 1 2 3; do
            if git pull -q --rebase origin "${{ inputs.branche }}" && git push -q origin "HEAD:${{ inputs.branche }}"; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
