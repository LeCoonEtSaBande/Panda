name: Collecte des parties

on:
  push:
    branches: [cursor/analyse-6da8]
    paths: [analyse/collecte.ini]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collecter
        timeout-minutes: 330
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python3 analyse/collecte.py

      - name: Rapport
        if: always()
        run: python3 analyse/rapport.py

      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyse/donnees analyse/resultats 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
            exit 0
          fi
          git commit -m "Collecte : $(($(wc -l < analyse/donnees/parties.csv) - 1)) parties au total."
          for essai in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
