name: Lancer une collecte

# Bouton « Run workflow », ou modification de collecte/collecte.ini sur main.
# La clé Riot est le secret RIOT_API_KEY du dépôt (Settings > Secrets and variables > Actions).
on:
  push:
    branches: [main]
    paths: [collecte/collecte.ini]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collecter
        timeout-minutes: 325
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          COMMANDE_SAUVEGARDE: bash collecte/enregistrer.sh
        run: python3 collecte/collecte.py

      - name: Bilan et enregistrement
        if: always()
        run: bash collecte/enregistrer.sh --rapport
