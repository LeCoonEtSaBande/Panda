name: Lancer une collecte

# Bouton « Run workflow », ou modification de analyse/collecte.ini sur main.
# La clé Riot est celle de « cle_api » dans analyse/collecte.ini.
on:
  push:
    branches: [main]
    paths: [analyse/collecte.ini]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer le rapport
        run: |
          python3 -m pip install -q --break-system-packages statsmodels pandas || python3 -m pip install -q statsmodels pandas || echo "statsmodels indisponible : régression sautée."

      - name: Collecter
        timeout-minutes: 295
        env:
          COMMANDE_SAUVEGARDE: bash analyse/enregistrer.sh
        run: python3 analyse/collecte.py

      - name: Rapport et enregistrement
        if: always()
        run: bash analyse/enregistrer.sh --rapport
