name: "4 · (facultatif) Recuit : chercher des règles de compo, puis les confirmer sur C"

# À QUOI IL SERT : chercher des règles de composition d'équipe qui font gagner (« une compo tanky gagne plus contre
# deux assassins »…) et ne garder que celles qui tiennent sur des parties jamais vues. Facultatif : l'assistant
# marche sans ; seules les règles confirmées sur C y entrent (à la prochaine génération, bouton 5).
# QUAND : après une ou deux collectes (bouton 1), pour qu'il y ait assez de parties C. Avant le bouton 5.
# CE QU'IL FAIT, tout seul, à la suite (branche « analyse ») :
#   1. le recuit simulé, sur les tas A (choix des réglages) et B (jugement), jamais C ;
#   2. s'il y a au moins 5 000 parties C (collectées après le gel), la confirmation sur C : le meilleur réglage est
#      rejoué sur A + B et mesuré sur C, comparé à des tirages au hasard, effet par effet ;
#   3. C est alors consommé : un nouveau gel est posé, les collectes suivantes formeront le prochain C.
# Avec « seuil de hasard », les victoires sont tirées au sort : c'est le test témoin, sans confirmation.
on:
  workflow_dispatch:
    inputs:
      piste:
        description: "Règles cherchées : styles (les 10 scénarios du 27/10 sur les 11 types), styles_libre (tous les croisements de types, sans scénarios), ou les anciennes pistes teamfight / scenarios"
        type: choice
        options: [styles, styles_libre, teamfight, scenarios]
        default: styles
      minutes:
        description: "Durée du recuit, en minutes (240 au plus)"
        default: "60"
        required: true
      graine:
        description: "Graine du hasard (une autre graine = une autre exploration)"
        default: "1"
        required: true
      hasard:
        description: "Test témoin : victoires tirées au sort selon la seule force des champions (pas de confirmation)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recuit
  cancel-in-progress: false

jobs:
  recuit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: À quoi sert ce bouton
        run: |
          echo "### 4 · Recuit : règles de compo cherchées sur A et B, confirmées sur C" >> "$GITHUB_STEP_SUMMARY"
          echo "Piste ${{ inputs.piste }}, ${{ inputs.minutes }} min, graine ${{ inputs.graine }}${{ inputs.hasard && ', test témoin au hasard' || '' }}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: analyse
          fetch-depth: 0

      - name: Installer numpy, pandas, scipy, scikit-learn
        run: python3 -m pip install -q --break-system-packages numpy pandas scipy scikit-learn

      - name: Données à jour de main (non committées)
        run: |
          git fetch -q origin main
          git archive origin/main collecte donnees archives | tar -x

      - name: 1. Recuit simulé (tas A et B)
        timeout-minutes: 250
        run: |
          case "${{ inputs.piste }}" in
            styles*) SCRIPT=analyse/recuit/recuit_styles.py ;;   # recuit n° 3 : les 11 types, sans reclassement
            *) SCRIPT=analyse/recuit/recuit_pistes.py ;;          # recuit n° 2 : ancien catalogue
          esac
          python3 "$SCRIPT" --piste "${{ inputs.piste }}" --minutes "${{ inputs.minutes }}" --graine "${{ inputs.graine }}" \
            ${{ inputs.hasard && '--melanger' || '' }}

      - name: 2. Préparer la confirmation (assez de parties C ?)
        id: prep
        if: ${{ !inputs.hasard }}
        run: python3 analyse/recuit/apres_recuit.py preparer --piste "${{ inputs.piste }}"

      - name: 2. Confirmer sur C
        id: conf
        if: ${{ !inputs.hasard && steps.prep.outputs.confirmer == 'true' }}
        timeout-minutes: 60
        run: |
          CAT=""
          case "${{ inputs.piste }}" in styles*) ;; *) CAT="--catalogue analyse/catalogues/ancien_catalogue_2026-10-24.csv" ;; esac
          python3 analyse/confirmation/confirmer_pistes.py --fichier "${{ steps.prep.outputs.fichier }}" $CAT \
            --effets analyse/recuit/resultats/effets_a_confirmer.json --hasard 40
          F="${{ steps.prep.outputs.fichier }}"
          cat analyse/confirmation/resultats/confirmation_C_"${F%.json}"_*.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: 3. C consommé, nouveau gel
        if: ${{ steps.conf.outcome == 'success' }}
        run: python3 analyse/recuit/apres_recuit.py nouveau-gel --raison "la confirmation du recuit ${{ steps.prep.outputs.fichier }}"

      - name: Enregistrer les résultats sur la branche analyse
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyse/recuit/resultats analyse/confirmation/resultats analyse/base/decoupage.json
          if git diff --cached --quiet; then echo "Aucun résultat."; exit 0; fi
          git commit -q -m "Recuit ${{ inputs.piste }}, ${{ inputs.minutes }} min, graine ${{ inputs.graine }}${{ inputs.hasard && ', test témoin' || '' }}${{ steps.conf.outcome == 'success' && ', confirmé sur C' || '' }}"
          for essai in 1 2 3; do
            if git pull -q --rebase origin analyse && git push -q origin HEAD:analyse; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
