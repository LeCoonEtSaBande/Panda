name: Lancer un recuit simulé

# Bouton « Run workflow ». Le recuit lit seulement les tas A et B (voir analyse/iteratif/README.md).
# Le code vient de la branche choisie dans « branche » ; les données, toujours de main (à jour),
# sans être committées sur la branche. Seuls les résultats sont committés, sur la branche du code.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée du recuit, en minutes"
        default: "60"
        required: true
      graine:
        description: "Graine du hasard (une autre graine = une autre exploration)"
        default: "1"
        required: true
      hasard:
        description: "Victoires mélangées au hasard (mesure le score atteint par pure chance)"
        type: boolean
        default: false
      branche:
        description: "Branche du code"
        default: "analyse-iterative"
        required: true

permissions:
  contents: write

concurrency:
  group: recuit
  cancel-in-progress: false

jobs:
  recuit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
          fetch-depth: 0

      - name: Installer numpy, pandas, scipy
        run: python3 -m pip install -q --break-system-packages numpy pandas scipy

      - name: Données à jour de main (non committées)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/main"
          git archive origin/main analyse/donnees | tar -x -C "$RUNNER_TEMP/main"
          echo "PANDA_DONNEES=$RUNNER_TEMP/main/analyse/donnees" >> "$GITHUB_ENV"

      - name: Recuit simulé
        timeout-minutes: 310
        run: >
          python3 analyse/iteratif/bloc4_recuit.py
          --minutes "${{ inputs.minutes }}" --graine "${{ inputs.graine }}"
          ${{ inputs.hasard && '--melanger' || '' }}

      - name: Enregistrer les résultats
        if: always()
        run: |
          bash analyse/iteratif/enregistrer_resultats.sh "Recuit simulé, ${{ inputs.minutes }} min, graine ${{ inputs.graine }}${{ inputs.hasard && ', victoires mélangées' || '' }}"
