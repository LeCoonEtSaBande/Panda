name: Confirmer un recuit sur C

# Bouton « Run workflow ». Rejoue le meilleur réglage d'un recuit (appris sur A + B) et le mesure sur C :
# les parties collectées après le gel (analyse/base/decoupage.json), jamais lues par le recuit.
# Une fois C lu, il est « consommé » : poser un nouveau gel avant la prochaine confirmation.
# Résultats committés dans analyse/confirmation/resultats/ (branche analyse).
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier du recuit dans analyse/recuit/resultats (ex. recuit2_teamfight_20261024_0709.json)"
        required: true
      catalogue:
        description: "Catalogue utilisé pendant ce recuit"
        default: "analyse/catalogues/ancien_catalogue_2026-10-24.csv"
        required: true
      hasard:
        description: "Nombre de tirages au hasard pour le test d'ensemble"
        default: "40"
        required: true

permissions:
  contents: write

concurrency:
  group: confirmer-recuit
  cancel-in-progress: false

jobs:
  confirmer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analyse
          fetch-depth: 0

      - name: Installer numpy, pandas, scipy, scikit-learn
        run: python3 -m pip install -q --break-system-packages numpy pandas scipy scikit-learn

      - name: Données à jour de main (non committées)
        run: |
          git fetch -q origin main
          git archive origin/main collecte donnees archives | tar -x

      - name: Confirmer sur C
        run: >
          python3 analyse/confirmation/confirmer_pistes.py --fichier "${{ inputs.fichier }}"
          --catalogue "${{ inputs.catalogue }}" --effets analyse/export/assistant_donnees.json --hasard "${{ inputs.hasard }}"

      - name: Enregistrer les résultats sur la branche analyse
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyse/confirmation/resultats
          if git diff --cached --quiet; then echo "Aucun résultat."; exit 0; fi
          git commit -q -m "Confirmation sur C du recuit ${{ inputs.fichier }}"
          for essai in 1 2 3; do
            if git pull -q --rebase origin analyse && git push -q origin HEAD:analyse; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
